<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Luciano Masala</title>
    <style>
        @font-face {
            font-family: 'SF UI Display';
            src: url('SFUIDisplay-Regular.ttf') format('opentype');
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        .header-image {
            width: 1920px;
            height: 541px;
            display: block;
            object-fit: cover;
        }

        .nav-container {
            position: absolute;
            top: 570px;
            left: 0;
            width: 1920px;
            display: flex;
            justify-content: center;
            gap: 180px;
        }

        .nav-item {
            position: relative;
            font-family: 'SF UI Display', -apple-system, sans-serif;
            font-size: 24px;
        }

        .nav-link {
            color: #808080;
            text-decoration: none;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .arrow {
            font-size: 12px;
            margin-left: 6px;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            min-width: 160px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            padding: 10px 0;
            z-index: 10;
        }

        .dropdown-menu a {
            color: #808080;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
            white-space: nowrap;
        }

        .dropdown-menu a:hover {
            background-color: #f5f5f5;
        }

        .nav-item:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body>

    <img src="lucianomasala1.png" alt="lucianomasala1" class="header-image">

    <div class="nav-container">
        <div class="nav-item">
            <a href="https://papercutieswiki.github.io/aboutme" class="nav-link">chi sono</a>
        </div>
        
        <div class="nav-item">
            <a href="https://papercutieswiki.github.io/mymusic" class="nav-link">la mia musica<span class="arrow">▼</span></a>
            <div class="dropdown-menu">
                <a href="https://papercutieswiki.github.io/papercuties">papercuties</a>
                <a href="https://papercutieswiki.github.io/marie">marie</a>
                <a href="https://papercutieswiki.github.io/hershel">hershel</a>
            </div>
        </div>

        <div class="nav-item">
            <a href="https://papercutieswiki.github.io/works" class="nav-link">lavori</a>
        </div>

        <div class="nav-item">
            <a href="mailto:buizmc@gmail.com" class="nav-link">contattami</a>
        </div>
    </div>

</body>
</html>
